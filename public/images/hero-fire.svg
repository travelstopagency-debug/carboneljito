<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Coal fire texture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120b08"/>
      <stop offset="35%" stop-color="#30170d"/>
      <stop offset="65%" stop-color="#4a1f0b"/>
      <stop offset="100%" stop-color="#120b08"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.4" r="0.42">
      <stop offset="0%" stop-color="#ff9f3d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff9f3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.75" cy="0.58" r="0.35">
      <stop offset="0%" stop-color="#ff6a1a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <g opacity="0.35">
    <circle cx="220" cy="640" r="120" fill="#22120d"/>
    <circle cx="420" cy="700" r="150" fill="#1d120c"/>
    <circle cx="640" cy="640" r="130" fill="#29130c"/>
    <circle cx="860" cy="700" r="160" fill="#21100a"/>
    <circle cx="1090" cy="650" r="130" fill="#27140d"/>
    <circle cx="1320" cy="690" r="150" fill="#24130b"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
